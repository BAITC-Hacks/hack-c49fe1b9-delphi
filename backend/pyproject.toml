[project]
name = "delphi-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "openai>=2,<3",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.8,<3",
    "pypdf>=5,<7",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "reportlab>=4,<5",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
